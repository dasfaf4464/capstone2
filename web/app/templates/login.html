<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToT - 로그인</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .card { background: white; padding: 40px; border-radius: 16px; width: 340px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  h1 { font-size: 30px; font-weight: 800; color: #4f8ef7; margin-bottom: 4px; }
  .sub { color: #aaa; font-size: 13px; margin-bottom: 32px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; margin-top: 16px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
  input:focus { border-color: #4f8ef7; }
  .btn { width: 100%; padding: 13px; background: #4f8ef7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 24px; transition: background 0.2s; }
  .btn:hover { background: #3a7ae0; }
  .link { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
  .link a { color: #4f8ef7; text-decoration: none; font-weight: 600; }
  .error { color: #e55; font-size: 13px; margin-top: 10px; display: none; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>ToT ✈️</h1>
  <p class="sub">내 여행 사진을 AI가 정리해드립니다</p>

  <label>아이디</label>
  <input type="text" id="user_id" placeholder="아이디 입력">

  <label>비밀번호</label>
  <input type="password" id="user_pw" placeholder="비밀번호 입력">

  <p class="error" id="error_msg">아이디 또는 비밀번호가 틀렸습니다.</p>
  <button class="btn" onclick="login()">로그인</button>
  <p class="link">계정이 없으신가요? <a href="/signup">회원가입</a></p>
</div>

<script>
async function login() {
  const user_id = document.getElementById('user_id').value.trim();
  const user_pw = document.getElementById('user_pw').value.trim();
  if (!user_id || !user_pw) return;

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: user_id, pw: user_pw })
  });
  const data = await res.json();

  if (data.result === 'success') {
    location.href = '/home';
  } else {
    document.getElementById('error_msg').style.display = 'block';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
