<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아카이브</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 20px;
            width: 100vw; height: 100vh;
            background-color: #f4f4f9;
            display: flex; flex-direction: column; gap: 15px;
            font-family: sans-serif;
        }

        .box { background-color: white; border: 2px solid #333; border-radius: 8px; padding: 20px; color: #333; }
        header.box { padding: 15px; font-size: 1.2rem; font-weight: bold; text-align: center; }
        nav { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .user-name { font-weight: bold; }
        .btn { padding: 8px 16px; border: 1px solid #333; background-color: white; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background-color: #eee; }
        .content-wrapper { display: flex; flex: 1; gap: 15px; min-height: 0; }
        .sidebar { flex: 1.5; display: flex; flex-direction: column; gap: 10px; padding: 20px 10px; }
        .sidebar-item { padding: 10px; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background-color: #e3f2fd; font-weight: bold; color: #007bff; }
        .main-content { flex: 8.5; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .search-bar { display: flex; gap: 10px; padding: 15px; margin-bottom: 25px; }
        .search-bar select, .search-bar input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .search-bar input { flex: 1; }
        #photo-gallery { display: flex; flex-wrap: wrap; gap: 25px; width: 100%; }
        .category-container { display: flex; flex-direction: column; }
        .category-tab { width: fit-content; background-color: white; border: 2px solid #333; border-bottom: none; padding: 8px 15px; font-weight: bold; border-radius: 8px 8px 0 0; }
        .category-box { background-color: white; border: 2px solid #333; min-height: 120px; padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start; align-items: flex-start; border-radius: 0 8px 8px 8px; }
        .photo-item {
            width: 80px; height: 60px;
            background-color: #f0f0f0; border: 1px dashed #999; border-radius: 4px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.8rem; color: #888; transition: 0.3s ease;
            cursor: pointer;
        }
        .photo-item:hover { border-color: #007bff; background-color: #e3f2fd; transform: scale(1.05); }
        .layout-1 .category-container { width: 100%; }
        .layout-2 .category-container { width: calc(33.333% - 17px); } 
        .layout-3 .category-container, .layout-3 .category-box { display: contents; }
        .layout-3 .category-tab { display: none; }
        .layout-3 .photo-item { width: calc(25% - 19px); height: 120px; border: 2px solid #333; background-color: white; font-size: 1rem; font-weight: bold; }
        .detail-layout { display: flex; gap: 20px; height: 100%; }
        .detail-photo {
            flex: 7; display: flex; justify-content: center; align-items: center;
            background-color: #eee; font-size: 2rem; color: #888; min-height: 400px;
            border-radius: 8px; border: 2px solid #333;
        }
        .detail-info {
            flex: 3; display: flex; flex-direction: column; gap: 15px;
            padding: 20px; font-size: 1.1rem; border-radius: 8px; border: 2px solid #333; background-color: white;
        }
        .detail-info h3 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .detail-info p { margin: 5px 0; color: #444; }

    </style>
</head>
<body>

    <header class="box" id="page-header">아카이브 </header>

    <nav>
        <div>
            <button class="btn" onclick="location.href='extraction'">동영상 추출 이동 버튼</button>
        </div>
        <div class="nav-right">
            <span class="user-name">회원이름 출력</span>
            <button class="btn">로그아웃 버튼</button>
        </div>
    </nav>

    <div class="content-wrapper">
        
        <div class="box sidebar">
            <div class="sidebar-item active" onclick="changeLayout('layout-1', this)">레이아웃 선택 1</div>
            <div class="sidebar-item" onclick="changeLayout('layout-2', this)">레이아웃 선택 2</div>
            <div class="sidebar-item" onclick="changeLayout('layout-3', this)">레이아웃 선택 3</div>
            <div class="sidebar-item" style="margin-top: 20px;">메뉴 ...</div>
        </div>

        <div class="main-content">
            
            <div id="gallery-view">
                <div class="box search-bar">
                    <select><option>정렬 (최신순)</option><option>오래된순</option><option>정확도순</option></select>
                    <input type="text" placeholder="검색어 입력">
                    <button class="btn">검색 버튼</button>
                </div>

                <div id="photo-gallery" class="layout-1">
                    <div class="category-container">
                        <div class="category-tab">카테고리 1</div>
                        <div class="category-box">
                            <div class="photo-item" onclick="openDetail(this)">사진 1</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 2</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 3</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 4</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 5</div>
                        </div>
                    </div>

                    <div class="category-container">
                        <div class="category-tab">카테고리 2</div>
                        <div class="category-box">
                            <div class="photo-item" onclick="openDetail(this)">사진 6</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 7</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 8</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 9</div>
                            <div class="photo-item" onclick="openDetail(this)">사진 10</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="detail-view" style="display: none;">
                <div style="margin-bottom: 15px;">
                    <button class="btn" onclick="closeDetail()">⬅ 목록으로 돌아가기</button>
                    <button class="btn" id="btn-download" style="background-color: #007bff; color: white;">이미지 다운로드</button>
                </div>

                <div class="detail-layout">
                    <div class="detail-photo" id="selected-photo-display">선택한 사진</div>
                    <div class="detail-info">
                        <h3>사진 정보</h3>
                        <p><strong>파일명:</strong> <span id="info-name"></span></p>
                        <p><strong>카테고리:</strong> <span id="info-category"></span></p>
                        <p><strong>정확도:</strong> <span id="info-accuracy"></span></p>
                        <p><strong>추출일:</strong> <span id="info-date"></span></span></p>
                        <p><strong>프롬프트:</strong> <span id="info-prompt"></span></p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="/static/archive.js"></script>

</body>
</html>
