<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - YOLO 팀</title>
</head>
<body>
    <div>
        <h1>프로그램 로고</h1>
    </div>

    <hr>

    <div>
        <h2>회원가입</h2>
        <form id="signupForm">
            <div>
                <label>닉네임</label><br>
                <input type="text" id="nickname" name="nickname" placeholder="닉네임을 입력하세요" required>
                <button type="button" onclick="checkNickname()">중복검사</button>
            </div>
            <br>
            <div>
                <label>이메일</label><br>
                <input type="email" id="email" name="email" placeholder="이메일을 입력하세요" required>
            </div>
            <br>
            <div>
                <label>비밀번호</label><br>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <br>
            <button type="submit">회원가입</button>
            <button type="button">Google로 회원가입</button>
        </form>
        <br>
        <a href="login.html">계정이 이미 있으신가요? 로그인하기</a>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nickname = document.getElementById('nickname').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nickname, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    alert('회원가입 성공!');
                    location.href = 'login.html';
                } else {
                    alert('회원가입 실패: ' + (result.message || '알 수 없는 오류'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('서버 연결에 실패했습니다.');
            }
        });

        async function checkNickname() {
            const nickname = document.getElementById('nickname').value;
            if(!nickname) return alert('닉네임을 입력해주세요.');
            alert('중복 검사 기능은 API 명세에 따라 추가 구현이 필요합니다.');
        }
    </script>
</body>
</html>
