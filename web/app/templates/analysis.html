<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoLo - 성향 분석</title>
<link rel="stylesheet" href="/static/common.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .stat-bar-wrap { margin-bottom: 10px; }
  .stat-label { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; }
  .stat-bar { height: 10px; background: #eee; border-radius: 10px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 10px; transition: width 0.6s ease; }
  .keyword-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .keyword-item { background: #f0f4ff; color: #4f8ef7; border-radius: 20px; padding: 5px 14px; font-size: 13px; }
  .keyword-count { color: #aaa; font-size: 11px; margin-left: 2px; }
  .rec-box { background: #f0f4ff; border-radius: 12px; padding: 18px; font-size: 14px; color: #444; line-height: 1.7; white-space: pre-line; }
  .personality-badge { display: inline-block; background: #4f8ef7; color: white; border-radius: 20px; padding: 6px 16px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .personality-desc { font-size: 14px; color: #444; line-height: 1.8; white-space: pre-line; margin-top: 10px; background: #f8f9ff; border-radius: 10px; padding: 14px 16px; }
</style>
</head>
<body>

<div class="top-bar">
  <span class="title">성향 분석</span>
</div>

<div class="content">

  <!-- 성향 문구 -->
  <div class="card">
    <p class="section-title">내 여행 성향</p>
    <div id="personality_badge"></div>

    <!-- 주카테고리 막대 -->
    <div id="category_bars"></div>
  </div>

  <!-- 자주 찍은 키워드 -->
  <div class="card">
    <p class="section-title">자주 찍은 키워드</p>
    <div class="keyword-list" id="keyword_list">
      <p style="color:#aaa;font-size:13px">아직 키워드가 없습니다.</p>
    </div>
  </div>

  <!-- 성향 분석 -->
  <div class="card" id="personality_desc_card" style="display:none">
    <p class="section-title">✍️ 성향 분석</p>
    <div class="rec-box" id="personality_desc_box"></div>
  </div>

  <!-- 추천 -->
  <div class="card">
    <p class="section-title">다음 여행지 추천</p>
    <div class="rec-box" id="recommendation">분석 중입니다...</div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="/archive" class="nav-item">
    <span class="icon">🗂️</span>아카이브
  </a>
  <a href="/search" class="nav-item">
    <span class="icon">🔍</span>검색
  </a>
  <a href="/upload" class="nav-plus">＋</a>
  <a href="/analysis" class="nav-item active">
    <span class="icon">📊</span>성향분석
  </a>
  <a href="/home" class="nav-item">
    <span class="icon">🏠</span>홈
  </a>
</nav>

<script>
const BAR_COLORS = { '풍경/장소': '#4f8ef7', '음식': '#ff9f43', '기록': '#2ecc71' };

// 타이핑 효과: el에 text를 한 글자씩 출력, 완료 후 onDone 콜백
function typeText(el, text, speed, onDone) {
  el.textContent = '';
  let i = 0;
  function tick() {
    if (i < text.length) {
      el.textContent += text[i++];
      setTimeout(tick, speed);
    } else if (onDone) {
      onDone();
    }
  }
  tick();
}

async function loadAnalysis() {
  const [statsRes, recRes] = await Promise.all([
    fetch('/api/user/stats'),
    fetch('/api/user/recommendation')
  ]);
  const stats = await statsRes.json();
  const rec   = await recRes.json();

  // 주카테고리 막대 차트 (즉시 표시)
  const catStats = stats.category_stats || {};
  const total    = Object.values(catStats).reduce((a, b) => a + b, 0);
  const barsEl   = document.getElementById('category_bars');
  barsEl.innerHTML = Object.entries(catStats).map(([cat, cnt]) => {
    const pct   = total > 0 ? Math.round(cnt / total * 100) : 0;
    const color = BAR_COLORS[cat] || '#4f8ef7';
    return `
      <div class="stat-bar-wrap">
        <div class="stat-label"><span>${cat}</span><span>${pct}%</span></div>
        <div class="stat-bar">
          <div class="stat-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }).join('');

  // 키워드 (즉시 표시)
  const keywords = stats.keyword_stats || [];
  if (keywords.length > 0) {
    document.getElementById('keyword_list').innerHTML = keywords.map(k =>
      `<div class="keyword-item">#${k.keyword}<span class="keyword-count">${k.count}</span></div>`
    ).join('');
  }

  // 성향 배지 타이핑
  const badgeEl = document.getElementById('personality_badge');
  if (rec.personality_type) {
    badgeEl.innerHTML = `<div class="personality-badge" id="badge_text"></div>`;
    const badgeText = document.getElementById('badge_text');

    typeText(badgeText, rec.personality_type, 60, () => {
      // 배지 완료 후 → 성향 분석 본문 타이핑
      if (rec.personality_desc) {
        const descCard = document.getElementById('personality_desc_card');
        const descBox  = document.getElementById('personality_desc_box');
        descCard.style.display = 'block';
        typeText(descBox, rec.personality_desc, 18, () => {
          // 성향 분석 완료 후 → 추천 글 타이핑
          const recEl = document.getElementById('recommendation');
          const recText = rec.recommendation || '사진을 더 업로드하면 추천을 드릴 수 있어요!';
          typeText(recEl, recText, 18, null);
        });
      } else {
        const recEl = document.getElementById('recommendation');
        const recText = rec.recommendation || '사진을 더 업로드하면 추천을 드릴 수 있어요!';
        typeText(recEl, recText, 18, null);
      }
    });
  } else {
    document.getElementById('recommendation').textContent =
      rec.recommendation || '사진을 더 업로드하면 추천을 드릴 수 있어요!';
  }
}

loadAnalysis();
</script>
</body>
</html>
