<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>분석 - YOLO 팀</title>
</head>
<body>
    <nav>
        <h3>프로그램 로고</h3>
        <ul>
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="analysis.html">분석</a></li>
            <li><a href="archive.html">아카이브</a></li>
        </ul>
    </nav>
    <hr>

    <div>
        <h2>채팅창</h2>

        <div id="chatWindow" style="border: 1px solid black; padding: 10px; margin-bottom: 20px; min-height: 300px; overflow-y: auto;">
            <p style="text-align: center; color: gray;" id="welcomeMsg">영상을 업로드하고 질문을 입력해주세요.</p>
        </div>

        <form id="chatForm">
            <input type="file" id="videoFile" accept="video/*">
            <input type="text" id="userQuery" placeholder="질문을 입력하세요" style="width: 300px;">
            <button type="button" onclick="sendMessage()">전송</button>
        </form>
    </div>

    <script>
        function sendMessage() {
            const queryInput = document.getElementById('userQuery');
            const fileInput = document.getElementById('videoFile');
            const chatWindow = document.getElementById('chatWindow');
            const welcomeMsg = document.getElementById('welcomeMsg');

            if (queryInput.value.trim() === "") {
                alert("질문을 입력해주세요!");
                return;
            }

            if (welcomeMsg) welcomeMsg.remove();

            // 사용자가 보낸 메시지 화면에 만들기
            const userMsgDiv = document.createElement('div');
            userMsgDiv.style.textAlign = 'right';
            userMsgDiv.style.marginBottom = '10px';
            
            // 파일이 있으면 파일명도 같이 표시
            const fileName = fileInput.files[0] ? `[${fileInput.files[0].name}] ` : "";
            userMsgDiv.innerHTML = `<span style="background: #eee; padding: 5px 10px; border-radius: 10px;">${fileName}${queryInput.value}</span>`;
            
            // 채팅창에 추가
            chatWindow.appendChild(userMsgDiv);

            queryInput.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
