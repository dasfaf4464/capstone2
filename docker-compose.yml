name: capstone

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: capstone_web
    volumes:
      - ./web:/workspace:rw # 소스코드 폴더
      - ./media_storage:/${MEDIA_STORAGE_BASE} # 이미지 물리저장소
    working_dir: /workspace
    ports:
      - "5000:5000"
    depends_on:
      postgresql:
        condition: service_healthy
    secrets:
      - source: gcp_key
        target: gcp-key.json

    env_file: .env
    tty: true
    command: python run.py
    networks:
      - capstone-bridge

  postgresql:
    build:
      context: ./postgresql
      dockerfile: Dockerfile
    container_name: capstone_postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ 
        "CMD-SHELL", 
        "psql -U admin capstone_db -c \"SELECT to_regclass('public.users');\" | grep -q users"
        ]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    env_file: .env
    volumes:
      - ./postgresql/db_data:/var/lib/postgresql/data # 데이터베이스 물리저장소
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql # 초기화용 sql
    tty: true
    networks:
      - capstone-bridge

  db_monitor:
    image: adminer
    restart: always
    container_name: capstone_adminer
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - "8080:8080"
    expose:
      - 8080
    networks:
      - capstone-bridge

networks:
  capstone-bridge:
    driver: bridge

secrets:
  gcp_key:
    file: ./gcp-key.json
